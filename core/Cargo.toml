[package]
name = "telegram_photos_core"
version = "0.3.1"
description = "Telegram Photos - Rust core (MTProto, crypto, SQLite, media pipeline) shared between the Tauri app and the Flutter UI"
edition = "2021"

[lib]
name = "telegram_photos_core"
crate-type = ["rlib"]

[dependencies]
# --- Serialization ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# --- Local database (same crate family as grammers-session to avoid dual sqlite links) ---
sqlite = { version = "0.37.0", features = ["bundled"] }

# --- Media processing (EXIF + thumbnails + hashing) ---
kamadak-exif = "0.6"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
sha2 = "0.10"
hex = "0.4"

# --- Crypto (zero-knowledge encryption) ---
chacha20poly1305 = { version = "0.10", features = ["stream"] }
argon2 = "0.5"
base64 = "0.22"

# --- Async runtime ---
tokio = { version = "1", features = ["full"] }

# --- Misc ---
rand = "0.9"
md5 = "0.8"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
log = "0.4"
once_cell = "1"
parking_lot = "0.12"
generic-array = "0.14"

[dev-dependencies]
tempfile = "3"
