[package]
name = "rust_lib_telegram_photos"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.12.0"
serde_json = "1"
telegram_photos_core = { path = "../../core" }

# --- Telegram MTProto (Grammers) ---
grammers-client = { git = "https://github.com/Lonami/grammers", rev = "d07f96f" }
grammers-session = { git = "https://github.com/Lonami/grammers", rev = "d07f96f" }
grammers-mtsender = { git = "https://github.com/Lonami/grammers", rev = "d07f96f" }
grammers-tl-types = { git = "https://github.com/Lonami/grammers", rev = "d07f96f" }

# --- Crypto deps ---
base64 = "0.22"
rand = "0.9"
md5 = "0.8"

# --- Async ---
tokio = { version = "1", features = ["full"] }
log = "0.4"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

# core2 v0.4.0 is yanked on crates.io — vendored locally
[patch.crates-io]
core2 = { path = "../../vendor/core2" }
