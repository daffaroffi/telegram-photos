[package]
name = "telegram-photos"
version = "0.1.0"
description = "Telegram Photos - Mobile-first cloud photo gallery & auto-backup powered by Telegram Cloud with 1-click Google Photos importer"
authors = ["Telegram Photos"]
edition = "2021"

[lib]
name = "telegram_photos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"

# --- Telegram MTProto (Grammers, pinned rev matching Telegram-Drive reference) ---
grammers-client = { git = "https://github.com/Lonami/grammers", rev = "d07f96f" }
grammers-session = { git = "https://github.com/Lonami/grammers", rev = "d07f96f" }
grammers-mtsender = { git = "https://github.com/Lonami/grammers", rev = "d07f96f" }
grammers-tl-types = { git = "https://github.com/Lonami/grammers", rev = "d07f96f" }

# --- Async runtime ---
tokio = { version = "1", features = ["full"] }
futures = "0.3"
bytes = "1"

# --- Serialization ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# --- Local database (same crate family as grammers-session to avoid dual sqlite links) ---
sqlite = { version = "0.37.0", features = ["bundled"] }

# --- Crypto (Zero-Knowledge Vault: XChaCha20-Poly1305 + Argon2id) ---
chacha20poly1305 = "0.10"
argon2 = "0.5"
rand = "0.9"
sha2 = "0.10"
md5 = "0.8"
hex = "0.4"
zeroize = { version = "1", features = ["derive"] }

# --- Media processing (EXIF + thumbnails + hashing) ---
kamadak-exif = "0.6"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }

# --- Google Photos API client ---
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }

# --- Misc ---
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
url = "2"
percent-encoding = "2"
uuid = { version = "1", features = ["v4"] }
log = "0.4"
once_cell = "1"
parking_lot = "0.12"

[target.'cfg(target_os = "android")'.dependencies]
ndk-context = "0.1"
jni = "0.21"

[patch.crates-io]
# core2 0.4.0 is yanked on crates.io but is required by glass_pumpkin (used by
# grammers-crypto for MTProto). Vendored locally so fresh builds can resolve.
core2 = { path = "vendor/core2-0.4.0" }

[dev-dependencies]
tempfile = "3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
